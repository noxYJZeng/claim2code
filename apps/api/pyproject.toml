# ============================================================
# Claim2Code API — Python package metadata
# ============================================================
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claim2code-api"
version = "0.1.0"
description = "Claim2Code backend — paper-to-code verification agent"
requires-python = ">=3.11"
authors = [{ name = "Claim2Code" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "openai>=1.50",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools]
packages = ["claim2code_api"]

[tool.setuptools.package-dir]
claim2code_api = "claim2code_api"

# ---- Lint / format ----
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

# ---- Pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: integration tests (require docker / testcontainers)",
    "safety: responsible-AI adversarial tests",
]
