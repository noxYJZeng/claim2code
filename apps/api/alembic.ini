# ============================================================
# Claim2Code — Alembic configuration
# (Located at apps/api/alembic.ini; relative paths are resolved from this
#  file's directory, so `script_location = migrations` means
#  apps/api/migrations/.)
# ============================================================
[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

# DATABASE_URL is supplied programmatically by migrations/env.py from
# claim2code_api.app.config. Do not set sqlalchemy.url here.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
