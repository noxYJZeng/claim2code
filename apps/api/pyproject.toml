# ============================================================
# Claim2Code API — Python package metadata
# ============================================================
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claim2code-api"
version = "0.1.0"
description = "Claim2Code backend — paper-to-code verification agent"
requires-python = ">=3.11"
authors = [{ name = "Claim2Code" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "openai>=1.50",
    # Claude as a selectable chat provider (llm/chat_backends.py).
    "anthropic>=2.3",
    "pymupdf>=1.24",
    "python-multipart>=0.0.9",
    # Phase 3 — tree-sitter grammars for multi-language symbol extraction.
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    # Phase 3 — YAML config parsing (JSON/TOML/INI use stdlib).
    "PyYAML>=6.0",
    # Phase 4 — pgvector adapter for SQLAlchemy (the Postgres extension
    # itself is provided by the pgvector image; this Python package
    # teaches the driver the ``VECTOR(...)`` type).
    "pgvector>=0.3",
    # Phase 9 — OpenTelemetry tracing + metrics. API + SDK + OTLP-HTTP
    # exporter + FastAPI instrumentation. Console exporter lives in the
    # SDK itself. Pin minor versions so a future OTel release cannot
    # silently change span semantics on us.
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
    "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools]
packages = ["claim2code_api"]

[tool.setuptools.package-dir]
claim2code_api = "claim2code_api"

# ---- Lint / format ----
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

# ---- Pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests are opt-in: ``make test-integration`` adds the
# ``-m integration`` flag, so plain ``pytest`` runs only unit tests
# (and skips anything that needs a real Postgres / docker).
addopts = "-m 'not integration and not safety and not observability'"
markers = [
    "integration: integration tests (require docker / testcontainers)",
    "safety: responsible-AI adversarial tests",
    "observability: Phase 9 OTel tracing/metrics tests (opt-in; default suite skips)",
]
